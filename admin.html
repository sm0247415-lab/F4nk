<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  background: black;
  color: white;
  font-family: Arial;
}

h1 {
  text-align: center;
  color: #ff7eb3;
}

.box {
  background: rgba(255,255,255,0.1);
  margin: 10px;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<h1>🔥 Admin Panel</h1>
<div id="data"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHchAe__ToUrxYMTQ0Agx4kDSmUE36bV4",
  authDomain: "rate-me-3efb9.firebaseapp.com",
  projectId: "rate-me-3efb9"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🔥 REAL-TIME DATA
db.collection("feedback").onSnapshot((snap) => {
  let html = "";

  snap.forEach(doc => {
    let d = doc.data();

    html += `
    <div class="box">
      <b>${d.name || "Anonymous"}</b><br>
      Eyes: ${d.eyes}<br>
      Hair: ${d.hair}<br>
      Hands: ${d.hands}<br>
      Best: ${d.best}<br>
      Feedback: ${d.feedback}
    </div>
    `;
  });

  document.getElementById("data").innerHTML = html;
});
</script>

</body>
</html>
