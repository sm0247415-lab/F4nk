<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>🌸 Rate Me</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  background: black;
  color: white;
  font-family: Arial;
  text-align: center;
}

/* Admin button (corner) */
.admin-btn {
  position: fixed;
  top: 10px;
  right: 10px;
  background: transparent;
  color: #ff7eb3;
  border: 1px solid #ff7eb3;
  padding: 5px 10px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 12px;
}

.container {
  max-width: 400px;
  margin: auto;
  padding: 20px;
  margin-top: 50px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
}

input, select, textarea {
  width: 100%;
  margin: 10px 0;
  padding: 10px;
  border-radius: 10px;
  border: none;
}

button {
  background: #ff4e9b;
  color: white;
  padding: 12px;
  border: none;
  border-radius: 10px;
}
</style>
</head>

<body>

<button class="admin-btn" onclick="adminLogin()">Admin</button>

<div class="container">
<h1>🌸 Rate Me</h1>

<input id="name" placeholder="Your name">

<select id="eyes">
<option>😍 Beautiful</option>
<option>😊 Cute</option>
<option>😐 Normal</option>
</select>

<select id="hair">
<option>🔥 Stylish</option>
<option>🙂 Okay</option>
</select>

<select id="hands">
<option>👌 Perfect</option>
<option>🙂 Normal</option>
</select>

<textarea id="best" placeholder="What you like most"></textarea>
<textarea id="feedback" placeholder="Feedback"></textarea>

<button onclick="send()">Submit 💌</button>
</div>

<script>
// 🔥 Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDHchAe__ToUrxYMTQ0Agx4kDSmUE36bV4",
  authDomain: "rate-me-3efb9.firebaseapp.com",
  projectId: "rate-me-3efb9",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function send() {
  db.collection("feedback").add({
    name: document.getElementById("name").value,
    eyes: document.getElementById("eyes").value,
    hair: document.getElementById("hair").value,
    hands: document.getElementById("hands").value,
    best: document.getElementById("best").value,
    feedback: document.getElementById("feedback").value
  });

  alert("Submitted 🔥");
}

// 🔐 Simple Admin Login
function adminLogin() {
  let pass = prompt("Enter Admin Password");

  if(pass === "monirul123") {
    window.location.href = "admin.html";
  } else {
    alert("Wrong Password ❌");
  }
}
</script>

</body>
</html>
