<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Rate Me</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, monospace;
  background: linear-gradient(135deg,#000,#1a1a2e);
  color: white;
}

/* Container */
.container {
  max-width: 400px;
  margin: auto;
  padding: 20px;
  margin-top: 60px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
}

h1 {
  text-align: center;
  color: #ff7eb3;
}

.field { margin-top: 15px; }

input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 5px;
  background: rgba(255,255,255,0.1);
  color: white;
}

.submit {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #ff4e9b;
  color: white;
  cursor: pointer;
}

#msg {
  text-align: center;
  margin-top: 10px;
  color: #00ffcc;
}

/* 🔥 Hacker-style Music Buttons */
.music-box {
  position: fixed;
  bottom: 50%;
  left: 50%;
  transform: translate(-50%, 50%);
  display: flex;
  align-items: center;
  gap: 15px;
  background: rgba(0,0,0,0.7);
  padding: 15px 25px;
  border-radius: 20px;
  border: 2px solid #0f0;
  box-shadow: 0 0 20px #0f0, 0 0 40px #0f0 inset;
  font-family: "Courier New", monospace;
  z-index: 1000;
}

.music-box button {
  background: black;
  color: #0f0;
  border: 2px solid #0f0;
  padding: 12px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  text-transform: uppercase;
  transition: 0.3s;
}

.music-box button:hover {
  background: #0f0;
  color: black;
  box-shadow: 0 0 10px #0f0, 0 0 20px #0f0 inset;
}

.music-box input[type="range"] {
  cursor: pointer;
  accent-color: #0f0;
  width: 100px;
}
</style>
</head>

<body>

<!-- Music buttons -->
<div class="music-box">
  <button onclick="playMusic()">▶️ Play</button>
  <button onclick="pauseMusic()">⏸ Pause</button>
  <input type="range" min="0" max="1" step="0.1" onchange="setVolume(this.value)">
</div>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="container">
<h1>🌸 Rate Me</h1>

<input id="name" placeholder="Your Name (optional)">
<div class="field">
<input id="eyes" placeholder="How are my eyes?">
</div>
<div class="field">
<input id="hair" placeholder="How is my hair?">
</div>
<div class="field">
<input id="hands" placeholder="How are my hands?">
</div>

<textarea id="best" placeholder="What do you like most"></textarea>
<textarea id="feedback" placeholder="Overall feedback"></textarea>

<button class="submit" onclick="send()">Submit 💌</button>
<p id="msg"></p>
</div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDHchAe__ToUrxYMTQ0Agx4kDSmUE36bV4",
  authDomain: "rate-me-3efb9.firebaseapp.com",
  projectId: "rate-me-3efb9",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🎵 Music control
const music = document.getElementById("bgMusic");
function playMusic(){ music.play(); }
function pauseMusic(){ music.pause(); }
function setVolume(v){ music.volume = v; }

// 💌 Feedback send
function send(){
  const name = document.getElementById("name").value.trim();
  const eyes = document.getElementById("eyes").value.trim();
  const hair = document.getElementById("hair").value.trim();
  const hands = document.getElementById("hands").value.trim();
  const best = document.getElementById("best").value.trim();
  const feedback = document.getElementById("feedback").value.trim();

  db.collection("feedback").add({
    name: name || "Anonymous",
    eyes: eyes || "No comment",
    hair: hair || "No comment",
    hands: hands || "No comment",
    best: best || "Nothing",
    feedback: feedback || "No feedback"
  })
  .then(()=>{
    document.getElementById("msg").innerText = "Thanks for your feedback 💖";

    // Clear inputs
    document.getElementById("name").value="";
    document.getElementById("eyes").value="";
    document.getElementById("hair").value="";
    document.getElementById("hands").value="";
    document.getElementById("best").value="";
    document.getElementById("feedback").value="";
  });
}

// 🔐 Admin login
function adminLogin(){
  let pass = prompt("Enter password");
  if(pass==="monirul123"){ window.location.href="admin.html"; }
  else { alert("Wrong ❌"); }
}
</script>
</body>
</html>
