<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Rate Me</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: linear-gradient(135deg,#000,#1a1a2e);
  color: white;
}

/* Admin button */
.admin-btn {
  position: fixed;
  top: 10px;
  right: 10px;
  padding: 6px 12px;
  border-radius: 10px;
  border: 1px solid #ff7eb3;
  background: transparent;
  color: #ff7eb3;
}

/* Music panel */
.music-box {
  position: fixed;
  bottom: 10px;
  left: 10px;
  background: rgba(0,0,0,0.6);
  padding: 10px;
  border-radius: 10px;
  font-size: 12px;
}

.music-box button {
  margin: 2px;
  padding: 5px;
  border: none;
  border-radius: 5px;
  background: #ff4e9b;
  color: white;
}

/* Container */
.container {
  max-width: 400px;
  margin: auto;
  padding: 20px;
  margin-top: 60px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
}

h1 {
  text-align: center;
  color: #ff7eb3;
}

.field { margin-top: 15px; }

input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 5px;
}

/* Button */
.submit {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #ff4e9b;
  color: white;
}

#msg {
  text-align: center;
  margin-top: 10px;
  color: #00ffcc;
}
</style>
</head>

<body>

<button class="admin-btn" onclick="adminLogin()">Admin</button>

<!-- 🎵 MUSIC SYSTEM -->
<div class="music-box">
  🎵 Music<br>
  <button onclick="playMusic()">▶️</button>
  <button onclick="pauseMusic()">⏸</button>
  <br>
  <input type="range" min="0" max="1" step="0.1" onchange="setVolume(this.value)">
</div>

<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="container">
<h1>🌸 Rate Me</h1>

<input id="name" placeholder="Your Name">

<div class="field">
<input id="eyes" placeholder="How are my eyes?">
</div>

<div class="field">
<input id="hair" placeholder="How is my hair?">
</div>

<div class="field">
<input id="hands" placeholder="How are my hands?">
</div>

<textarea id="best" placeholder="What do you like most"></textarea>
<textarea id="feedback" placeholder="Feedback"></textarea>

<button class="submit" onclick="send()">Submit 💌</button>

<p id="msg"></p>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDHchAe__ToUrxYMTQ0Agx4kDSmUE36bV4",
  authDomain: "rate-me-3efb9.firebaseapp.com",
  projectId: "rate-me-3efb9",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🎵 MUSIC CONTROL
const music = document.getElementById("bgMusic");

function playMusic() {
  music.play();
}

function pauseMusic() {
  music.pause();
}

function setVolume(v) {
  music.volume = v;
}

// 💌 SEND FUNCTION
function send() {
  const name = nameInput = document.getElementById("name").value.trim();
  const eyes = document.getElementById("eyes").value.trim();
  const hair = document.getElementById("hair").value.trim();
  const hands = document.getElementById("hands").value.trim();
  const best = document.getElementById("best").value.trim();
  const feedback = document.getElementById("feedback").value.trim();

  db.collection("feedback").add({
    name: name || "Anonymous",
    eyes: eyes || "No comment",
    hair: hair || "No comment",
    hands: hands || "No comment",
    best: best || "Nothing",
    feedback: feedback || "No feedback"
  })
  .then(() => {
    document.getElementById("msg").innerText = "Thanks for your feedback 💖";

    document.getElementById("name").value = "";
    document.getElementById("eyes").value = "";
    document.getElementById("hair").value = "";
    document.getElementById("hands").value = "";
    document.getElementById("best").value = "";
    document.getElementById("feedback").value = "";
  });
}

// 🔐 ADMIN LOGIN
function adminLogin() {
  let pass = prompt("Enter Password");

  if(pass === "monirul123") {
    window.location.href = "admin.html";
  } else {
    alert("Wrong ❌");
  }
}
</script>

</body>
</html>
