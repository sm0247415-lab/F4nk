<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌸 Rate Me</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

<style>
body {
  margin: 0;
  font-family: Arial, monospace;
  background: linear-gradient(135deg,#000,#1a1a2e);
  color: white;
}

/* Container */
.container {
  max-width: 400px;
  margin: auto;
  padding: 20px;
  margin-top: 60px;
  background: rgba(255,255,255,0.05);
  border-radius: 15px;
}

h1 { text-align: center; color: #ff7eb3; }
.field { margin-top: 15px; }

input, textarea {
  width: 100%;
  padding: 10px;
  border-radius: 10px;
  border: none;
  margin-top: 5px;
  background: rgba(255,255,255,0.1);
  color: white;
}

.submit {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  border: none;
  border-radius: 10px;
  background: #ff4e9b;
  color: white;
  cursor: pointer;
}

#msg { text-align: center; margin-top: 10px; color: #00ffcc; }

/* Music Buttons below submit */
.music-box {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 15px;
  margin-top: 15px;
}

.music-box button {
  background: black;
  color: #0f0;
  border: 2px solid #0f0;
  padding: 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
  text-transform: uppercase;
  font-size: 14px;
  transition: 0.3s;
}

.music-box button:hover {
  background: #0f0;
  color: black;
  box-shadow: 0 0 8px #0f0, 0 0 15px #0f0 inset;
}

/* Admin Button Top-Right */
#adminBtn {
  position: fixed;
  top: 10px;
  right: 10px;
  background: black;
  color:#0f0;
  border:2px solid #0f0;
  padding:5px 10px;
  border-radius:8px;
  font-size:12px;
  cursor:pointer;
  z-index:1000;
}
</style>
</head>

<body>

<!-- Admin button -->
<button id="adminBtn" onclick="adminLogin()">Admin</button>

<div class="container">
<h1>🌸 Rate Me</h1>

<input id="name" placeholder="Your Name (optional)">
<div class="field">
<input id="eyes" placeholder="How are my eyes?">
</div>
<div class="field">
<input id="hair" placeholder="How is my hair?">
</div>
<div class="field">
<input id="hands" placeholder="How are my hands?">
</div>

<textarea id="best" placeholder="What do you like most"></textarea>
<textarea id="feedback" placeholder="Overall feedback"></textarea>

<button class="submit" onclick="send()">Submit 💌</button>
<p id="msg"></p>

<!-- Music buttons under submit -->
<div class="music-box">
  <button onclick="toggleMusic()">▶️ Play / ⏸ Off</button>
</div>
<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

</div>

<script>
// Firebase config
const firebaseConfig = {
  apiKey: "AIzaSyDHchAe__ToUrxYMTQ0Agx4kDSmUE36bV4",
  authDomain: "rate-me-3efb9.firebaseapp.com",
  projectId: "rate-me-3efb9",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// 🎵 Music control
const music = document.getElementById("bgMusic");
let isPlaying = false;
function toggleMusic(){
  if(isPlaying){ music.pause(); isPlaying=false; }
  else { music.play(); isPlaying=true; }
}

// 💌 Feedback send
function send(){
  const name = document.getElementById("name").value.trim();
  const eyes = document.getElementById("eyes").value.trim();
  const hair = document.getElementById("hair").value.trim();
  const hands = document.getElementById("hands").value.trim();
  const best = document.getElementById("best").value.trim();
  const feedback = document.getElementById("feedback").value.trim();

  db.collection("feedback").add({
    name: name || "Anonymous",
    eyes: eyes || "No comment",
    hair: hair || "No comment",
    hands: hands || "No comment",
    best: best || "Nothing",
    feedback: feedback || "No feedback"
  })
  .then(()=>{
    document.getElementById("msg").innerText = "Thanks for your feedback 💖";

    // Clear inputs
    document.getElementById("name").value="";
    document.getElementById("eyes").value="";
    document.getElementById("hair").value="";
    document.getElementById("hands").value="";
    document.getElementById("best").value="";
    document.getElementById("feedback").value="";
  });
}

// 🔐 Admin login
function adminLogin(){
  let pass = prompt("Enter password");
  if(pass==="monirul123"){ window.location.href="admin.html"; }
  else { alert("Wrong ❌"); }
}
</script>

</body>
</html>
